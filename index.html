<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <!-- Две метки для системной темы (media). Ручная тема в приложении ставит свой цвет в обе
         (ThemeSwitch.syncThemeColor), «как в системе» возвращает каждой исходный. -->
    <meta name="theme-color" content="#161826" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f3f2f9" media="(prefers-color-scheme: light)" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>Tartaluga Hub</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
