name: Прощальный релиз на Pages

# Старый адрес: только прощальная страница «Хаб переехал» (ADR-007, съезд). Запускается вручную,
# когда владелец проверил новый адрес. Тесты на каждый push гоняет сборка Cloudflare.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run schema:check
      - run: npm run typecheck
      - run: npm test
      # Старый адрес получает только прощальную страницу «Хаб переехал» (ADR-007).
      - run: npm run build
        env:
          VITE_MOVED: '1'
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
